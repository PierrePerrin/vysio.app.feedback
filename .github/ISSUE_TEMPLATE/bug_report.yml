name: "🐛 Bug Report"
description: Tell us about something that isn't working
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Tell us what went wrong. Only the first field is required; the rest are optional.

  - type: textarea
    id: summary
    attributes:
      label: What isn't working?
      description: Briefly describe what happened.
      placeholder: "The workspace closes when I press Cmd+W."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it? (optional)
      description: Share any steps you remember.
      placeholder: |
        1. Open Vysio
        2. Do the action that caused the problem
        3. Describe what happened

  - type: input
    id: environment
    attributes:
      label: Device and app version (optional)
      description: Share these if you know them.
      placeholder: "iPad model, iPadOS version, Vysio version"

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs (optional)
      description: Attach anything that might help, if available.
