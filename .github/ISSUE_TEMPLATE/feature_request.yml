name: "✨ Feature Request"
description: Request a specific feature or improvement
title: "[Feature]: "
labels:
  - feature
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        For questions and open-ended ideas, use [GitHub Discussions](https://github.com/PierrePerrin/vysio.app.feedback/discussions).
        Use this form when you want to track a specific feature request.

  - type: textarea
    id: idea
    attributes:
      label: What would you like Vysio to do?
      description: Describe the change or feature you'd like.
      placeholder: "Add a way to quickly switch between workspaces."
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: How would it help you? (optional)
      description: Share the problem this would solve, if you like.
      placeholder: "It would make switching between projects faster."

  - type: textarea
    id: context
    attributes:
      label: Screenshots, links, or more context (optional)
      description: Add anything else that might help us understand your idea.
